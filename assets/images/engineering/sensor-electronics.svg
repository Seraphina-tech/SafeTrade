        <path d="M39 13v32m-13-16 13-12 13 12m-26 9 13 9 13-9" fill="none" stroke="#316ac5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="39" y="88" text-anchor="middle" fill="#425872" font-size="11">IMU</text>
