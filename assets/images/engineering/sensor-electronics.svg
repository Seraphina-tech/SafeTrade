<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 245" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative SafeTrade concept component groups</title>
  <desc id="desc">Three separate groups show a proposed ESP32-S3 controller, concept environmental and motion sensor modules, and proposed LED, vibration motor, and buzzer local alert outputs. This is not an assembled circuit or hardware photograph.</desc>
  <defs>
    <linearGradient id="controller" x2="1" y2="1">
      <stop stop-color="#e8f1fc"/>
      <stop offset="1" stop-color="#d7e6f6"/>
    </linearGradient>
    <linearGradient id="chip" x2="0" y2="1">
      <stop stop-color="#425c79"/>
      <stop offset="1" stop-color="#243b57"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="245" rx="16" fill="#f9fbfe"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(28 25)">
      <rect width="330" height="195" rx="14" fill="#fff" stroke="#dce5ef" stroke-width="2"/>
      <text x="22" y="31" fill="#667a91" font-size="12" font-weight="700" letter-spacing="1.5">CONTROLLER / CONCEPT</text>
      <rect x="91" y="61" width="148" height="89" rx="12" fill="url(#controller)" stroke="#9fb4ca" stroke-width="2"/>
      <rect x="128" y="79" width="75" height="51" rx="7" fill="url(#chip)"/>
      <path d="M119 70v-13m20 13v-13m20 13v-13m20 13v-13m20 13v-13m20 13v-13M119 151v13m20-13v13m20-13v13m20-13v13m20-13v13m20-13v13M80 84H67m13 20H67m13 20H67m172-40h14m-14 20h14m-14 20h14" stroke="#7892ad" stroke-width="3" stroke-linecap="round"/>
      <circle cx="102" cy="177" r="5" fill="#25bfd8"/>
      <text x="165" y="110" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">ESP32-S3</text>
      <text x="165" y="184" text-anchor="middle" fill="#73869b" font-size="12">Proposed controller</text>
    </g>
    <g transform="translate(435 25)">
      <rect width="330" height="195" rx="14" fill="#fff" stroke="#dce5ef" stroke-width="2"/>
      <text x="22" y="31" fill="#667a91" font-size="12" font-weight="700" letter-spacing="1.5">SENSING / CONCEPT INPUTS</text>
