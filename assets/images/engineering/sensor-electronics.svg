        <path d="M18 50h42" stroke="#b8cadd" stroke-width="3" stroke-linecap="round"/>
        <text x="39" y="88" text-anchor="middle" fill="#425872" font-size="11">PM · UV · IR</text>
      </g>
      <g transform="translate(126 64)">
